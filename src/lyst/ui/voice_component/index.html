<html><head><meta charset="utf-8">
<style>
  :root { --fg: #1f2328; --muted: #6b7280; --accent: #0B6B64; --line: #d0d7de; --bg: transparent; }
  @media (prefers-color-scheme: dark) { :root { --fg: #e6edf3; --muted: #9aa4b2; --accent: #0E7C73; --line: #30363d; } }
  html, body { margin: 0; background: var(--bg); font: 14px/1.4 "Source Sans Pro", system-ui, sans-serif; color: var(--fg); }
  .wrap { display: flex; align-items: center; gap: 10px; height: 40px; }
  button { display: inline-flex; align-items: center; gap: 6px; height: 38px; padding: 0 14px; border-radius: 8px;
           border: 1px solid var(--line); background: transparent; color: var(--fg); cursor: pointer; font: inherit; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button.live { border-color: var(--accent); color: var(--accent); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .live .dot { background: var(--accent); animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .35; } }
  @media (prefers-reduced-motion: reduce) { .live .dot { animation: none; } }
  .state { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
</style></head>
<body><div class="wrap">
  <button id="mic" type="button" aria-pressed="false" aria-label="Speak a question"><span class="dot"></span><span id="label">Speak</span></button>
  <span class="state" id="state" aria-live="polite"></span>
</div>
<script>
  const post = (type, extra) => window.parent.postMessage(Object.assign({ isStreamlitMessage: true, type }, extra || {}), "*");
  const send = (value) => post("streamlit:setComponentValue", { value, dataType: "json" });
  const Rec = window.SpeechRecognition || window.webkitSpeechRecognition;
  const mic = document.getElementById("mic"), label = document.getElementById("label"), stateEl = document.getElementById("state");
  let rec = null, listening = false, n = 0, spoken = null, mode = "push_to_talk";
  const setState = (t) => { stateEl.textContent = t || ""; };
  function stopSpeaking() { if (window.speechSynthesis && speechSynthesis.speaking) speechSynthesis.cancel(); }
  function start() {
    if (!Rec) { setState("Voice isn't available in this browser; type instead."); send({ n: ++n, unavailable: true }); return; }
    stopSpeaking();  // barge-in: talking over Lyst stops its speech
    rec = new Rec(); rec.lang = navigator.language || "en-US"; rec.interimResults = true; rec.continuous = mode === "hands_free";
    rec.onresult = (e) => {
      let final = "", interim = "", conf = null;
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const r = e.results[i];
        if (r.isFinal) { final += r[0].transcript; if (r[0].confidence) conf = r[0].confidence; }  // Chrome reports 0: unknown
        else interim += r[0].transcript;
      }
      if (interim) setState("Heard: " + interim);
      if (final.trim()) { setState("Thinking…"); send(Object.assign({ n: ++n, text: final.trim() }, conf ? { confidence: conf } : {})); }
    };
    rec.onerror = (e) => { setState(e.error === "not-allowed" ? "Microphone access was refused." : "Didn't catch that."); finish(); };
    rec.onend = () => { if (listening && mode === "hands_free") { try { rec.start(); } catch (_) { finish(); } } else finish(); };
    listening = true; mic.classList.add("live"); mic.setAttribute("aria-pressed", "true"); label.textContent = "Listening…";
    setState("Speak now"); rec.start();
  }
  function finish() { listening = false; mic.classList.remove("live"); mic.setAttribute("aria-pressed", "false"); label.textContent = "Speak"; }
  mic.addEventListener("click", () => { if (listening) { listening = false; rec && rec.stop(); finish(); } else start(); });
  window.addEventListener("message", (ev) => {
    const d = ev.data || {}; if (d.type !== "streamlit:render") return;
    const a = d.args || {}; mode = a.mode || mode;
    if (a.state) setState(a.state);
    if (a.stop) stopSpeaking();
    if (a.speak && a.speak_id && a.speak_id !== spoken && window.speechSynthesis) {
      spoken = a.speak_id; const u = new SpeechSynthesisUtterance(a.speak); u.lang = navigator.language || "en-US";
      u.onend = () => setState(""); setState("Speaking… (talk to interrupt)"); speechSynthesis.speak(u);
    }
  });
  post("streamlit:componentReady", { apiVersion: 1 });
  post("streamlit:setFrameHeight", { height: 44 });
</script></body></html>
