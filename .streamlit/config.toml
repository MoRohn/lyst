# Lyst's look: restrained, precise, one accent. Light and dark are both defined, so the
# viewer's settings menu keeps the appearance toggle.
[server]
headless = true
runOnSave = false

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false

[theme]
font = "sans-serif"
codeFont = "monospace"
baseRadius = "small"
showWidgetBorder = true
showSidebarBorder = true
baseFontSize = 15
headingFontWeights = [600, 600, 600, 500, 500, 500]

# One accent: Lyst's brand teal, at a shade that keeps white button text at WCAG AA (6.4:1 light, 5.1:1 dark).
[theme.light]
primaryColor = "#0B6B64"
linkColor = "#0B6B64"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f5f6f8"
textColor = "#16181d"
borderColor = "#e3e5ea"
chartCategoricalColors = ["#0B6B64", "#5b6577", "#d9822b", "#8a63d2", "#d64550", "#12A79B"]

[theme.dark]
primaryColor = "#0E7C73"
linkColor = "#5CC9B6"
backgroundColor = "#0f1115"
secondaryBackgroundColor = "#171a20"
textColor = "#e6e8ec"
borderColor = "#262a33"
chartCategoricalColors = ["#2BB5A6", "#8b95a7", "#f0a35a", "#a98ae6", "#ec6b74", "#7FD4C2"]
