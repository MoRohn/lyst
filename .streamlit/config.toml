# Lyst's look: restrained, precise, one accent. Light and dark are both defined, so the
# viewer's settings menu keeps the appearance toggle.
[server]
headless = true
runOnSave = false

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false

[theme]
font = "sans-serif"
codeFont = "monospace"
baseRadius = "small"
showWidgetBorder = true
showSidebarBorder = true
baseFontSize = 15
headingFontWeights = [600, 600, 600, 500, 500, 500]

[theme.light]
primaryColor = "#1f5eff"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f5f6f8"
textColor = "#16181d"
borderColor = "#e3e5ea"
chartCategoricalColors = ["#1f5eff", "#0f9d8a", "#d9822b", "#8a63d2", "#d64550", "#5b6577"]

[theme.dark]
primaryColor = "#6e93ff"
backgroundColor = "#0f1115"
secondaryBackgroundColor = "#171a20"
textColor = "#e6e8ec"
borderColor = "#262a33"
chartCategoricalColors = ["#6e93ff", "#2dc2ac", "#f0a35a", "#a98ae6", "#ec6b74", "#8b95a7"]
