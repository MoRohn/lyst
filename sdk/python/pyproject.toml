[project]
name = "lyst-client"
version = "0.1.0"
description = "Python client for the Lyst HTTP API: datasets, files, questions, SQL, events and webhooks."
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-only"
dependencies = ["httpx>=0.27,<1"]

[project.optional-dependencies]
pandas = ["pandas>=2"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lyst_client"]
