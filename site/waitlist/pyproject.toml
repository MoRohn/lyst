[project]
name = "lyst-waitlist"
version = "0.1.0"
description = "Optional early-access registration service for the Lyst website. FastAPI + DuckDB, single writer."
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-only"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "duckdb>=1.1",
  "pydantic>=2.8",
  "cryptography>=43",
]

[project.scripts]
lyst-waitlist = "lyst_waitlist.cli:main"

[dependency-groups]
dev = ["pytest>=8.3", "httpx>=0.27"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lyst_waitlist"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
