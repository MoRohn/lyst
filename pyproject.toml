[project]
name = "lyst"
version = "0.1.0"
description = "Lyst: a governed, mostly autonomous AI analyst. DuckDB-first, open-source core."
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
dependencies = [
  "duckdb>=2.0,<3",
  "fastapi>=0.162,<1",
  "uvicorn>=0.54,<1",
  "pydantic>=2.14,<3",
  "httpx>=0.28,<1",
  "sqlglot>=30.29,<31",
  "pandas>=3.1,<4",
  "pyarrow>=26",
  "numpy>=2.5",
  "scipy>=1.18",
  "statsmodels>=0.15",
  "python-multipart>=0.0.33",
  "pytz>=2025.2",
  "openpyxl>=3.1",
  "pyjwt[crypto]>=2.10",
  "prometheus-client>=0.21",
  "python-json-logger>=3",
  "pypdf>=5",
  "psycopg[binary]>=3.2",
  "mcp>=1.2",
  "reportlab>=4.2",
  "python-pptx>=1.0",
  "opentelemetry-sdk>=1.30",
  "opentelemetry-exporter-otlp-proto-http>=1.30",
  "dashkit",
  "stkit",
  "dash[diskcache]==4.4.1",
  "dash-mantine-components==2.8.1",
  "dash-ag-grid==35.3.0",
  "plotly==7.1.0",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
ui = ["streamlit==1.66.1", "plotly>=6"]

[project.scripts]
lyst = "lyst.cli:main"

[dependency-groups]
dev = ["pytest>=8.4", "ruff>=0.14", "pip-licenses>=5"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lyst"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "S608", "E501", "S603", "S404", "B008"]

[tool.ruff.lint.per-file-ignores]
"src/lyst/analytics/*" = ["ALL"]
"tests/*" = ["S105", "S106", "S108"]

[tool.uv.sources]
dashkit = { git = "https://github.com/MoRohn/ai-analytics", subdirectory = "dash/kit", rev = "d86ee66" }
stkit = { git = "https://github.com/MoRohn/ai-analytics", subdirectory = "streamlit/kit", rev = "d86ee66" }
